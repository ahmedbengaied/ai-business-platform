spring.datasource.url=jdbc:h2:mem:ai_business_platform_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.flyway.enabled=false

spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

app.jwt.secret=test-secret-key-that-is-at-least-32-bytes-long
app.jwt.expiration=3600
app.ai.provider=mock
app.workspaces.repositories-root=./target/test-repositories
app.workspaces.worktrees-root=./target/test-worktrees
