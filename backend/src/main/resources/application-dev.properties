spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/ai_business_platform}
spring.datasource.username=${DB_USERNAME:ai_business}
spring.datasource.password=${DB_PASSWORD:ai_business}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

server.port=${SERVER_PORT:8080}

app.jwt.secret=${JWT_SECRET:change-this-development-secret-key-at-least-32-bytes}
app.jwt.expiration=${JWT_EXPIRATION:3600}

app.ai.provider=${AI_PROVIDER:mock}
app.ai.openai.api-key=${OPENAI_API_KEY:}
app.ai.openai.model=${OPENAI_MODEL:gpt-4o-mini}
app.ai.openai.base-url=${OPENAI_BASE_URL:https://api.openai.com/v1}
app.ai.monthly-budget-usd=${AI_MONTHLY_BUDGET_USD:5.00}
app.ai.openai.input-usd-per-million-tokens=${OPENAI_INPUT_USD_PER_MILLION_TOKENS:0.15}
app.ai.openai.output-usd-per-million-tokens=${OPENAI_OUTPUT_USD_PER_MILLION_TOKENS:0.60}
app.tasks.max-execution-attempts=${TASK_MAX_EXECUTION_ATTEMPTS:3}
app.workspaces.repositories-root=${WORKSPACE_REPOSITORIES_ROOT:./repositories}
app.workspaces.worktrees-root=${WORKSPACE_WORKTREES_ROOT:./worktrees}
