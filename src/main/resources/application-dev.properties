spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/ai_business_platform}
spring.datasource.username=${DB_USERNAME:ai_business}
spring.datasource.password=${DB_PASSWORD:ai_business}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

server.port=${SERVER_PORT:8080}

app.jwt.secret=${JWT_SECRET:change-this-development-secret-key-at-least-32-bytes}
app.jwt.expiration=${JWT_EXPIRATION:3600}
