services:
  postgres:
    image: postgres:16-alpine
    container_name: ai-business-platform-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ai_business_platform
      POSTGRES_USER: ai_business
      POSTGRES_PASSWORD: ai_business
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ai_business -d ai_business_platform"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
