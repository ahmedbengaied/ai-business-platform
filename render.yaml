databases:
  - name: ai-business-platform-db
    plan: basic-256mb
    databaseName: ai_business_platform
    user: ai_business
    postgresMajorVersion: "16"

services:
  - type: web
    name: ai-business-platform-api
    runtime: docker
    plan: starter
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: DB_HOST
        fromDatabase:
          name: ai-business-platform-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: ai-business-platform-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: ai-business-platform-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: ai-business-platform-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: ai-business-platform-db
          property: password
      - key: JWT_SECRET
        generateValue: true
      - key: AI_PROVIDER
        value: mock
      - key: AI_MONTHLY_BUDGET_USD
        value: "5.00"
      - key: CORS_ALLOWED_ORIGINS
        sync: false

  - type: web
    name: ai-business-platform-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && node scripts/write-runtime-config.mjs && npm run build
    staticPublishPath: dist/frontend/browser
    envVars:
      - key: API_ORIGIN
        fromService:
          type: web
          name: ai-business-platform-api
          property: host
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
